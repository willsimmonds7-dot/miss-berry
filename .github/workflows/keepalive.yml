name: Supabase keep-alive

# Prevents the free-tier Supabase project from auto-pausing after 7 days
# of inactivity (which took the portal down on 25 Aug 2026).
# The key below is the public (publishable) key already shipped in index.html.

on:
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SB_KEY: sb_publishable_6uhoMvm9VCleYFkeWuxWfg_Ca8-hcpd
    steps:
      - name: Ping database
        run: |
          curl -sf --max-time 30 \
            "https://sefvzbvjfmkvhzvgarzg.supabase.co/rest/v1/growers?select=id&limit=1" \
            -H "apikey: $SB_KEY" \
            -H "Authorization: Bearer $SB_KEY" \
            -o /dev/null -w "HTTP %{http_code}\n"
