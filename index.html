<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#8e1f4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Miss Berry Portaal</title>
<style>
:root{
  --berry:#8e1f4f; --berry-d:#6d1339; --berry-l:#fdeef5; --ink:#2b1a22; --grey:#7a6a72;
  --bg:#faf7f8; --card:#ffffff; --line:#eadfe4; --ok:#1d7a4f; --ok-l:#e7f5ee;
  --warn:#b3560c; --warn-l:#fdf1e4; --bad:#b3232a; --bad-l:#fcebec; --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 60px}
.wrap.wide{max-width:860px}
header{background:var(--berry);color:#fff;padding:14px 0}
header .wrap{padding:0 14px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:800;font-size:19px;letter-spacing:.2px}
.brand small{display:block;font-weight:400;font-size:12px;opacity:.85}
.who{font-size:13px;text-align:right;opacity:.95}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px}
h2{font-size:16px;margin-bottom:10px;color:var(--berry-d)}
h3{font-size:14px;margin:14px 0 6px}
.lbl{font-size:13px;color:var(--grey);margin:12px 0 6px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 15px;font-size:15px;cursor:pointer;transition:.12s}
.chip.sel{background:var(--berry);border-color:var(--berry);color:#fff;font-weight:600}
.step{display:flex;align-items:center;gap:14px;margin-top:4px}
.step button{width:46px;height:46px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:22px;cursor:pointer}
.step .n{font-size:26px;font-weight:800;min-width:56px;text-align:center}
.step small{color:var(--grey)}
textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:15px;resize:vertical;min-height:44px}
.btn{display:block;width:100%;background:var(--berry);color:#fff;border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;margin-top:16px}
.btn:disabled{opacity:.45;cursor:default}
.btn.sub{background:#fff;color:var(--berry);border:1.5px solid var(--berry);padding:10px;font-size:14px;width:auto;display:inline-block;margin-top:8px}
.btn.tiny{padding:7px 12px;font-size:13px;margin:0;width:auto;display:inline-block}
.row{border-top:1px solid var(--line);padding:12px 2px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.row:first-child{border-top:0}
.row b{font-size:15px}
.row .sub2{color:var(--grey);font-size:13px;margin-top:2px}
.badge{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap}
.b-ok{background:var(--ok-l);color:var(--ok)} .b-warn{background:var(--warn-l);color:var(--warn)}
.b-bad{background:var(--bad-l);color:var(--bad)} .b-grey{background:#f0ecee;color:var(--grey)}
.truck{background:var(--warn-l);color:var(--warn);border:1.5px solid var(--warn);border-radius:10px;padding:9px 12px;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.err{background:var(--bad-l);color:var(--bad);border-radius:10px;padding:12px;font-size:14px;margin-top:12px;display:none}
.center{max-width:420px;margin:80px auto;text-align:center;padding:20px}
input[type=text],input[type=date],input[type=tel]{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dt{display:inline-flex;align-items:center;gap:6px;background:var(--berry-l);color:var(--berry-d);border-radius:999px;padding:6px 8px 6px 12px;font-size:13px;font-weight:600;margin:3px 3px 0 0}
.dt button{border:0;background:none;color:var(--berry-d);cursor:pointer;font-size:15px;line-height:1;padding:2px}
.muted{color:var(--grey);font-size:13px}
.linkbox{font-size:12px;background:#f6f1f3;border-radius:8px;padding:8px;word-break:break-all;color:var(--grey);margin-top:6px}
.spin{text-align:center;color:var(--grey);padding:40px 0}
details{border-top:1px solid var(--line);padding:10px 2px}
details summary{cursor:pointer;font-weight:600;font-size:15px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details summary::after{content:"▾";color:var(--grey)}
details[open] summary::after{content:"▴"}
@media(min-width:700px){.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}}
</style>
</head>
<body>
<header><div class="wrap"><div class="brand">🍓 Miss Berry<small id="subT">Aanmeldportaal</small></div><div class="who" id="who"></div></div></header>
<div id="app" class="wrap"><div class="spin">Laden…</div></div>
<div class="toast" id="toast"></div>
<script>
const API='https://sefvzbvjfmkvhzvgarzg.supabase.co/rest/v1/rpc/';
const KEY='sb_publishable_6uhoMvm9VCleYFkeWuxWfg_Ca8-hcpd';
const qs=new URLSearchParams(location.search);
let G_TOKEN=qs.get('t'), A_TOKEN=qs.get('admin');
// remember access so the installed app (PWA) works without the link's query string
try{
  if(A_TOKEN)localStorage.setItem('mb-access',JSON.stringify({role:'admin',token:A_TOKEN}));
  else if(G_TOKEN)localStorage.setItem('mb-access',JSON.stringify({role:'grower',token:G_TOKEN}));
  else{const s=JSON.parse(localStorage.getItem('mb-access')||'null');
    if(s){if(s.role==='admin')A_TOKEN=s.token;else G_TOKEN=s.token;}}
}catch(e){}
const MSG={invalid_token:'Deze link is niet (meer) geldig. Neem contact op met Miss Berry.',
  invalid_pickup_date:'Deze ophaaldag is niet beschikbaar. Kies een andere dag.',
  invalid_location:'Ongeldige locatie.', alert_already_open:'Er staat al een melding open voor deze aanmelding.'};
let CTX=null, sel={loc:null,prod:null,pallets:2,date:null};

async function rpc(fn,args){
  const r=await fetch(API+fn,{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});
  if(!r.ok){let m='';try{m=(await r.json()).message||''}catch(e){}
    throw new Error(MSG[m]||m||('Fout ('+r.status+')'));}
  const t=await r.text(); return t?JSON.parse(t):null;
}
function el(id){return document.getElementById(id)}
function toast(m){const t=el('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtD(d){return new Date(d+'T12:00:00').toLocaleDateString('nl-NL',{weekday:'short',day:'numeric',month:'short'})}
function todayStr(){const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')}
function fail(msg){el('app').innerHTML='<div class="center"><div style="font-size:40px">🫐</div><p style="margin-top:14px">'+esc(msg)+'</p></div>'}

/* ---------- GROWER PORTAL ---------- */
async function loadGrower(){
  try{CTX=await rpc('grower_context',{p_token:G_TOKEN});}catch(e){return fail(e.message)}
  el('who').textContent=CTX.grower.name;
  sel.loc=CTX.locations.length===1?CTX.locations[0].id:sel.loc;
  renderGrower();
}
function renderGrower(){
  const L=CTX.locations, P=CTX.products, A=CTX.announcements;
  const loc=L.find(l=>l.id===sel.loc);
  const dates=loc?loc.pickup_dates:[];
  if(sel.date&&!dates.includes(sel.date))sel.date=null;
  let h='<div class="card"><h2>Beschikbaarheid aanmelden</h2>';
  if(L.length>1){h+='<div class="lbl">Locatie</div><div class="chips">'+
    L.map(l=>'<button class="chip'+(sel.loc===l.id?' sel':'')+'" onclick="pick(\'loc\',\''+l.id+'\')">'+esc(l.name)+'</button>').join('')+'</div>';}
  h+='<div class="lbl">Product</div><div class="chips">'+
    P.map(p=>'<button class="chip'+(sel.prod===p.id?' sel':'')+'" onclick="pick(\'prod\',\''+p.id+'\')">'+esc(p.name_nl)+'</button>').join('')+'</div>';
  h+='<div class="lbl">Aantal pallets</div><div class="step"><button onclick="adj(-1)">−</button><span class="n">'+sel.pallets+'</span><button onclick="adj(1)">+</button><small>pallets</small></div>';
  h+='<div class="lbl">Ophaaldag</div>';
  h+=dates.length?'<div class="chips">'+dates.map(d=>'<button class="chip'+(sel.date===d?' sel':'')+'" onclick="pick(\'date\',\''+d+'\')">'+fmtD(d)+'</button>').join('')+'</div>'
    :'<div class="muted">'+(loc?'Nog geen ophaaldagen beschikbaar voor deze locatie. Miss Berry stelt deze in.':'Kies eerst een locatie.')+'</div>';
  h+='<div class="lbl">Opmerking (optioneel)</div><textarea id="note" rows="1" placeholder="Bijv. bijzonderheden over de partij"></textarea>';
  const ready=sel.loc&&sel.prod&&sel.date&&sel.pallets>0;
  h+='<button class="btn" id="sub" '+(ready?'':'disabled')+' onclick="submitAnn()">Aanmelden</button>';
  h+='<div class="err" id="ferr"></div></div>';

  h+='<div class="card"><h2>Mijn aanmeldingen</h2>';
  if(!A.length)h+='<div class="muted">Nog geen aanmeldingen.</div>';
  A.forEach(a=>{
    const late=a.status==='announced'&&a.pickup_date<=todayStr();
    const st=a.status==='picked_up'?['Opgehaald','b-ok']:a.status==='cancelled'?['Geannuleerd','b-grey']:['Aangemeld','b-warn'];
    h+='<div class="row"><div><b>'+a.pallets+' pallets '+esc(a.product_nl)+'</b><div class="sub2">'+esc(a.location)+' · ophalen '+fmtD(a.pickup_date)+'</div>'
      +(a.truck_alert?'<div class="sub2" style="color:var(--warn);font-weight:600">🚚 Melding verstuurd — Miss Berry is op de hoogte</div>'
        :(late?'<button class="truck" onclick="truck(\''+a.id+'\')">🚚 Waar blijft mijn vrachtwagen?</button>':''))
      +'</div><span class="badge '+st[1]+'">'+st[0]+'</span></div>';
  });
  h+='</div><p class="muted" style="margin-top:12px;text-align:center">Vragen? Bel of app Miss Berry zoals je gewend bent.</p>';
  el('app').innerHTML=h;
}
function pick(k,v){sel[k==='loc'?'loc':k==='prod'?'prod':'date']=(sel[k==='loc'?'loc':k==='prod'?'prod':'date']===v&&k!=='loc')?null:v;renderGrower()}
function adj(d){sel.pallets=Math.min(66,Math.max(1,sel.pallets+d));renderGrower()}
async function submitAnn(){
  el('sub').disabled=true;
  try{
    await rpc('create_announcement',{p_token:G_TOKEN,p_location:sel.loc,p_product:sel.prod,p_pallets:sel.pallets,p_pickup_date:sel.date,p_note:el('note').value});
    toast('✅ Aangemeld! Miss Berry plant het transport.');
    sel.prod=null;sel.date=null;sel.pallets=2;
    await loadGrower();
  }catch(e){const f=el('ferr');f.textContent=e.message;f.style.display='block';el('sub').disabled=false;}
}
async function truck(id){
  try{await rpc('raise_truck_alert',{p_token:G_TOKEN,p_announcement:id,p_message:null});
    toast('🚚 Melding verstuurd — Miss Berry zoekt het uit.');await loadGrower();
  }catch(e){toast(e.message)}
}

/* ---------- ADMIN (Manon) ---------- */
let ADM=null, newDates={};
async function loadAdmin(){
  try{ADM=await rpc('admin_overview',{p_token:A_TOKEN});}catch(e){return fail(e.message)}
  el('who').textContent='Beheer';el('subT').textContent='Dashboard';
  document.querySelector('.wrap#app').classList.add('wide');
  renderAdmin();
}
function renderAdmin(){
  const open=ADM.exceptions.filter(e=>!e.resolved_at);
  let h='';
  h+='<div class="card"><h2>🚨 Meldingen'+(open.length?' <span class="badge b-bad">'+open.length+' open</span>':'')+'</h2>';
  if(!open.length)h+='<div class="muted">Geen open meldingen. 🎉</div>';
  open.forEach(e=>{h+='<div class="row"><div><b>🚚 Waar blijft mijn vrachtwagen?</b><div class="sub2">'+esc(e.grower)+' · '+esc(e.location)+' · '+e.pallets+' pallets · ophalen '+fmtD(e.pickup_date)+'</div>'
    +(e.message?'<div class="sub2">“'+esc(e.message)+'”</div>':'')+'</div>'
    +'<button class="btn tiny" onclick="resolveExc(\''+e.id+'\')">Opgelost</button></div>';});
  h+='</div>';

  h+='<div class="cols">';
  h+='<div class="card"><h2>📋 Aanmeldingen</h2>';
  const ann=ADM.announcements.filter(a=>a.status!=='cancelled');
  if(!ann.length)h+='<div class="muted">Nog geen aanmeldingen.</div>';
  let lastD=null;
  ann.forEach(a=>{
    if(a.pickup_date!==lastD){h+='<h3>'+fmtD(a.pickup_date)+'</h3>';lastD=a.pickup_date;}
    const st=a.status==='picked_up'?['Opgehaald','b-ok']:['Aangemeld','b-warn'];
    h+='<div class="row"><div><b>'+esc(a.grower)+'</b>'+(a.open_alert?' <span class="badge b-bad">🚚 melding</span>':'')
      +'<div class="sub2">'+a.pallets+' pallets '+esc(a.product_nl)+' · '+esc(a.location)+(a.note?' · “'+esc(a.note)+'”':'')+'</div></div>'
      +'<div><span class="badge '+st[1]+'">'+st[0]+'</span>'
      +(a.status==='announced'?'<br><button class="btn tiny" style="margin-top:6px" onclick="setSt(\''+a.id+'\',\'picked_up\')">✓ Opgehaald</button>':'')
      +'</div></div>';
  });
  h+='</div>';

  h+='<div class="card"><h2>👩‍🌾 Telers & ophaaldagen</h2>';
  ADM.growers.forEach(g=>{
    h+='<details open><summary>'+esc(g.name)+' <span class="muted">'+g.locations.length+' locatie'+(g.locations.length===1?'':'s')+'</span></summary>';
    h+='<div class="muted" style="margin:6px 0">'+esc(g.contact||'')+(g.phone?' · '+esc(g.phone):'')+'</div>';
    h+='<div class="linkbox">Portaallink: '+location.origin+location.pathname+'?t='+g.token+'</div>'
      +'<button class="btn sub" onclick="copyLink(\''+g.token+'\')">📋 Kopieer link voor teler</button>';
    g.locations.forEach(l=>{
      h+='<h3>'+esc(l.name)+'</h3><div class="muted">'+esc(l.address||'')+'</div><div>';
      l.pickup_dates.filter(d=>d.active).forEach(d=>{h+='<span class="dt">'+fmtD(d.date)+'<button onclick="rmDate(\''+l.id+'\',\''+d.date+'\')">✕</button></span>';});
      h+='</div><div class="grid2" style="margin-top:8px"><input type="date" id="nd-'+l.id+'" min="'+todayStr()+'">'
        +'<button class="btn tiny" onclick="addDate(\''+l.id+'\')">+ Ophaaldag</button></div>';
    });
    h+='<div style="margin-top:10px"><button class="btn sub" onclick="addLoc(\''+g.id+'\')">+ Locatie toevoegen</button></div></details>';
  });
  h+='<div style="margin-top:12px"><button class="btn sub" onclick="addGrower()">+ Nieuwe teler</button></div></div>';
  h+='</div>';
  el('app').innerHTML=h;
}
function dset(l){return (ADM.growers.flatMap(g=>g.locations).find(x=>x.id===l)?.pickup_dates||[]).filter(d=>d.active).map(d=>d.date)}
async function addDate(lid){
  const v=el('nd-'+lid).value;if(!v)return toast('Kies eerst een datum');
  const ds=[...new Set([...dset(lid),v])];
  try{await rpc('admin_set_pickup_dates',{p_token:A_TOKEN,p_location:lid,p_dates:ds});toast('Ophaaldag toegevoegd');await loadAdmin();}catch(e){toast(e.message)}
}
async function rmDate(lid,d){
  const ds=dset(lid).filter(x=>x!==d);
  try{await rpc('admin_set_pickup_dates',{p_token:A_TOKEN,p_location:lid,p_dates:ds});toast('Ophaaldag verwijderd');await loadAdmin();}catch(e){toast(e.message)}
}
async function resolveExc(id){try{await rpc('admin_resolve_exception',{p_token:A_TOKEN,p_exception:id});toast('Melding opgelost');await loadAdmin();}catch(e){toast(e.message)}}
async function setSt(id,st){try{await rpc('admin_set_status',{p_token:A_TOKEN,p_announcement:id,p_status:st});await loadAdmin();}catch(e){toast(e.message)}}
async function addGrower(){
  const n=prompt('Naam teler (bedrijfsnaam):');if(!n)return;
  const c=prompt('Contactpersoon (optioneel):')||'';const p=prompt('Telefoon (optioneel):')||'';
  try{const r=await rpc('admin_upsert_grower',{p_token:A_TOKEN,p_id:null,p_name:n,p_contact:c,p_phone:p});
    const ln=prompt('Naam eerste locatie:','Hoofdlocatie');
    if(ln)await rpc('admin_upsert_location',{p_token:A_TOKEN,p_id:null,p_grower:r.id,p_name:ln,p_address:prompt('Adres (optioneel):')||''});
    toast('Teler toegevoegd');await loadAdmin();
  }catch(e){toast(e.message)}
}
async function addLoc(gid){
  const n=prompt('Naam locatie:');if(!n)return;
  try{await rpc('admin_upsert_location',{p_token:A_TOKEN,p_id:null,p_grower:gid,p_name:n,p_address:prompt('Adres (optioneel):')||''});
    toast('Locatie toegevoegd');await loadAdmin();
  }catch(e){toast(e.message)}
}
function copyLink(tok){
  const url=location.origin+location.pathname+'?t='+tok;
  (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>toast('Link gekopieerd — stuur via WhatsApp'),()=>prompt('Kopieer deze link:',url));
}

/* ---------- no-token: paste link ---------- */
function showLinkEntry(){
  el('app').innerHTML='<div class="center"><div style="font-size:40px">🫐</div>'
  +'<p style="margin-top:14px">Geen toegangslink. Open de persoonlijke link die je van Miss Berry hebt gekregen — of plak hem hieronder.</p>'
  +'<input id="lnk" placeholder="Plak hier je link of code" autocomplete="off" style="margin-top:14px;width:100%;max-width:340px;padding:13px;border:1.5px solid var(--line);border-radius:12px;font-size:15px">'
  +'<div style="max-width:340px;margin:0 auto"><button class="btn" onclick="useLink()">Openen</button></div>'
  +'<p id="lerr" style="color:#b3261e;margin-top:10px"></p></div>';
}
async function useLink(){
  const v=el('lnk').value.trim(); if(!v)return;
  let t=null,a=null;
  try{const u=new URL(v); t=u.searchParams.get('t'); a=u.searchParams.get('admin');}catch(e){}
  if(!t&&!a&&/^[0-9a-f]{64}$/i.test(v)){
    try{await rpc('grower_context',{p_token:v}); t=v;}
    catch(e){ try{await rpc('admin_overview',{p_token:v}); a=v;}catch(e2){} }
  }
  if(a)location.href='?admin='+encodeURIComponent(a);
  else if(t)location.href='?t='+encodeURIComponent(t);
  else el('lerr').textContent='Geen geldige link of code herkend.';
}

/* ---------- boot ---------- */
if(A_TOKEN)loadAdmin();
else if(G_TOKEN)loadGrower();
else showLinkEntry();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
