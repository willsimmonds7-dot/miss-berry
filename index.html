<title>Miss Berry Portaal</title>
<style>
:root{
  --berry:#8e1f4f; --berry-d:#6d1339; --berry-l:#fdeef5; --ink:#2b1a22; --grey:#7a6a72;
  --bg:#faf7f8; --card:#ffffff; --line:#eadfe4; --ok:#1d7a4f; --ok-l:#e7f5ee;
  --warn:#b3560c; --warn-l:#fdf1e4; --bad:#b3232a; --bad-l:#fcebec; --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 60px}
.wrap.wide{max-width:860px}
header{background:var(--berry);color:#fff;padding:14px 0}
header .wrap{padding:0 14px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:800;font-size:19px;letter-spacing:.2px}
.brand small{display:block;font-weight:400;font-size:12px;opacity:.85}
.who{font-size:13px;text-align:right;opacity:.95}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px}
h2{font-size:16px;margin-bottom:10px;color:var(--berry-d)}
h3{font-size:14px;margin:14px 0 6px}
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 6px}
.dayhead h3{margin:0}
.lbl{font-size:13px;color:var(--grey);margin:12px 0 6px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 15px;font-size:15px;cursor:pointer;transition:.12s}
.chip.sel{background:var(--berry);border-color:var(--berry);color:#fff;font-weight:600}
.wdrow{flex-wrap:nowrap;gap:5px}
.wdrow .chip{flex:1;min-width:0;padding:8px 0;font-size:13px;text-align:center}
.step{display:flex;align-items:center;gap:14px;margin-top:4px}
.step button{width:46px;height:46px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:22px;cursor:pointer}
.step .n{font-size:26px;font-weight:800;min-width:56px;text-align:center}
.step small{color:var(--grey)}
textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:15px;resize:vertical;min-height:44px}
.btn{display:block;width:100%;background:var(--berry);color:#fff;border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;margin-top:16px}
.btn:disabled{opacity:.45;cursor:default}
.btn.sub{background:#fff;color:var(--berry);border:1.5px solid var(--berry);padding:10px;font-size:14px;width:auto;display:inline-block;margin-top:8px}
.btn.tiny{padding:7px 12px;font-size:13px;margin:0;width:auto;display:inline-block}
.row{border-top:1px solid var(--line);padding:12px 2px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.row:first-child{border-top:0}
.row b{font-size:15px}
.row .sub2{color:var(--grey);font-size:13px;margin-top:2px}
.badge{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap}
.b-ok{background:var(--ok-l);color:var(--ok)} .b-warn{background:var(--warn-l);color:var(--warn)}
.b-bad{background:var(--bad-l);color:var(--bad)} .b-grey{background:#f0ecee;color:var(--grey)}
.truck{background:var(--warn-l);color:var(--warn);border:1.5px solid var(--warn);border-radius:10px;padding:9px 12px;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.err{background:var(--bad-l);color:var(--bad);border-radius:10px;padding:12px;font-size:14px;margin-top:12px;display:none}
.center{max-width:420px;margin:80px auto;text-align:center;padding:20px}
input[type=text],input[type=date],input[type=tel]{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dt{display:inline-flex;align-items:center;gap:6px;background:var(--berry-l);color:var(--berry-d);border-radius:999px;padding:6px 8px 6px 12px;font-size:13px;font-weight:600;margin:3px 3px 0 0}
.dt button{border:0;background:none;color:var(--berry-d);cursor:pointer;font-size:15px;line-height:1;padding:2px}
.muted{color:var(--grey);font-size:13px}
.route{border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;background:#fff}
.rhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.fill{height:9px;background:#f0ecee;border-radius:999px;margin-top:8px;overflow:hidden}
.fill i{display:block;height:100%;background:var(--berry);border-radius:999px}
.fill i.over{background:var(--bad)}
.pool{border:1.5px dashed var(--line);border-radius:12px;padding:12px;margin-top:10px}
.acard{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px;background:#fff}
.acard.flag{border-color:var(--warn);background:var(--warn-l)}
.acard.cflag{border-color:var(--bad);background:var(--bad-l)}
.acts{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
select{border:1.5px solid var(--line);border-radius:10px;padding:8px;font:inherit;font-size:14px;background:#fff}
.linkbox{font-size:12px;background:#f6f1f3;border-radius:8px;padding:8px;word-break:break-all;color:var(--grey);margin-top:6px}
.spin{text-align:center;color:var(--grey);padding:40px 0}
details{border-top:1px solid var(--line);padding:10px 2px}
details summary{cursor:pointer;font-weight:600;font-size:15px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details summary::after{content:"▾";color:var(--grey)}
details[open] summary::after{content:"▴"}
.subbox{background:#faf7f8;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
.sublbl{font-weight:600;font-size:14px}
@media(min-width:700px){.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}}
</style>

function t(k){return (I18N[LANG]&&I18N[LANG][k])||I18N.nl[k]||k}
function pname(o){return LANG==='en'?(o.product_en||o.product_nl):o.product_nl}
function toggleLang(){
  LANG=LANG==='nl'?'en':'nl';
  try{localStorage.setItem('mb-lang',LANG)}catch(e){}
  applyLang();
}
function applyLang(){
  el('langBtn').textContent=LANG==='nl'?'EN':'NL';
  if(A_TOKEN&&ADM){el('who').textContent=t('admin');el('subT').textContent=t('week_planner');renderAdmin();}
  else if(G_TOKEN&&CTX){el('subT').textContent=t('portal_sub');renderGrower();}
  else if(!A_TOKEN&&!G_TOKEN){el('subT').textContent=t('portal_sub');showLinkEntry();}
}
let CTX=null, sel={loc:null,prod:null,pallets:2,date:null,editing:null,note:''};

async function rpc(fn,args){
  const r=await fetch(API+fn,{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});
  if(!r.ok){let m='';try{m=(await r.json()).message||''}catch(e){}
    throw new Error(m?t(m):(t('err_generic')+' ('+r.status+')'));}
  const txt=await r.text(); return txt?JSON.parse(txt):null;
}
function el(id){return document.getElementById(id)}
function toast(m){const t=el('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtD(d){return new Date(d+'T12:00:00').toLocaleDateString(LANG==='en'?'en-GB':'nl-NL',{weekday:'short',day:'numeric',month:'short'})}
function todayStr(){const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')}
function fail(msg){el('app').innerHTML='<div class="center"><div style="font-size:40px">🫐</div><p style="margin-top:14px">'+esc(msg)+'</p></div>'}

/* ---------- GROWER PORTAL ---------- */
async function loadGrower(){
  try{CTX=await rpc('grower_context',{p_token:G_TOKEN});}catch(e){return fail(e.message)}
  el('who').textContent=CTX.grower.name;
  sel.loc=CTX.locations.length===1?CTX.locations[0].id:sel.loc;
  renderGrower();
}
const WD={nl:['ma','di','wo','do','vr','za','zo'],en:['Mo','Tu','We','Th','Fr','Sa','Su']};
const WDF={nl:['maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag','zondag'],en:['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday']};
function wdN(d){return (WD[LANG]||WD.nl)[d-1]}
function fmtFriendly(d){
  const dt=new Date(d+'T12:00:00'), now=new Date(todayStr()+'T12:00:00');
  const diff=Math.round((dt-now)/86400000);
  const wd=(WDF[LANG]||WDF.nl)[(dt.getDay()===0?7:dt.getDay())-1];
  const dm=dt.toLocaleDateString(LANG==='en'?'en-GB':'nl-NL',{day:'numeric',month:'short'});
  if(diff===0)return t('today_lbl')+' ('+dm+')';
  if(diff===1)return t('tomorrow')+' ('+dm+')';
  if(diff>1&&diff<7)return t('this_pre')+' '+wd+' ('+dm+')';
  if(diff>=7&&diff<14)return t('next_pre')+' '+wd+' ('+dm+')';
  return fmtD(d);
}
function ymd(dt){return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')}
function expandDates(loc){
  if(!loc)return[];
  const out=new Set(loc.pickup_dates||[]);
  const wds=loc.weekly_days||[];
  if(wds.length){
    const base=new Date();base.setHours(12,0,0,0);
    for(let i=0;i<56;i++){
      const c=new Date(base);c.setDate(base.getDate()+i);
      const iso=c.getDay()===0?7:c.getDay();
      if(wds.includes(iso))out.add(ymd(c));
    }
  }
  return [...out].sort();
}
function renderGrower(){
  const L=CTX.locations, P=CTX.products, A=CTX.announcements;
  const loc=L.find(l=>l.id===sel.loc);
  const all=expandDates(loc);
  let dates=all.slice(0,2);
  if(sel.date&&all.includes(sel.date)&&!dates.includes(sel.date))dates=[...dates,sel.date];
  if(sel.date&&!dates.includes(sel.date))sel.date=null;
  let h='';
  if(sel.success){
    const s=sel.success;
    h+='<div class="card" style="text-align:center;padding:30px 16px"><div style="font-size:48px">'+(s.upd?'✏️':'✅')+'</div>'
      +'<h2 style="margin-top:10px;font-size:20px;color:var(--ok)">'+(s.upd?t('succ_upd_h'):t('succ_h'))+'</h2>'
      +'<p style="margin-top:6px;font-weight:700">'+esc(s.text)+'</p>'

function pick(k,v){sel.note=el('note')?el('note').value:sel.note;
  sel[k==='loc'?'loc':k==='prod'?'prod':'date']=(sel[k==='loc'?'loc':k==='prod'?'prod':'date']===v&&k!=='loc')?null:v;renderGrower()}
function adj(d){sel.note=el('note')?el('note').value:sel.note;sel.pallets=Math.min(66,Math.max(1,sel.pallets+d));renderGrower()}
function editAnn(id){
  const a=CTX.announcements.find(x=>x.id===id);if(!a)return;
  sel={loc:a.location_id,prod:a.product_id,pallets:a.pallets,date:a.pickup_date,editing:id,note:a.note||''};
  renderGrower();window.scrollTo({top:0,behavior:'smooth'});
}
function stopEdit(){sel={loc:CTX.locations.length===1?CTX.locations[0].id:null,prod:null,pallets:2,date:null,editing:null,note:''};renderGrower()}
function newAnn(){stopEdit()}
function sameAgain(){
  const last=[...CTX.announcements].filter(a=>a.status!=='cancelled').sort((x,y)=>String(y.created_at||'').localeCompare(String(x.created_at||'')))[0];
  if(!last)return;
  const loc=CTX.locations.find(l=>l.id===last.location_id);
  const d=expandDates(loc).filter(x=>x>=todayStr())[0]||null;
  sel={loc:last.location_id,prod:last.product_id,pallets:last.pallets,date:d,editing:null,note:''};
  renderGrower();
}
async function cancelAnnG(id){
  if(!confirm(t('confirm_cancel')))return;
  try{await rpc('cancel_announcement',{p_token:G_TOKEN,p_announcement:id});
    toast(t('toast_cancelled'));
    if(sel.editing===id)stopEdit();
    await loadGrower();
  }catch(e){toast(e.message)}
}
async function submitAnn(){
  el('sub').disabled=true;
  try{
    const wasEdit=!!sel.editing;
    const loc=CTX.locations.find(l=>l.id===sel.loc), pr=CTX.products.find(p=>p.id===sel.prod);
    const txt=sel.pallets+' '+t('pallets')+' '+(pr?(LANG==='en'?pr.name_en:pr.name_nl):'')+' · '+(loc?loc.name:'')+' · '+fmtFriendly(sel.date);
    if(wasEdit){
      await rpc('update_announcement',{p_token:G_TOKEN,p_announcement:sel.editing,p_pallets:sel.pallets,p_pickup_date:sel.date,p_product:sel.prod,p_note:el('note').value});
    }else{
      await rpc('create_announcement',{p_token:G_TOKEN,p_location:sel.loc,p_product:sel.prod,p_pallets:sel.pallets,p_pickup_date:sel.date,p_note:el('note').value});
    }
    sel={loc:sel.loc,prod:null,pallets:2,date:null,editing:null,note:'',success:{upd:wasEdit,text:txt}};
    await loadGrower();
  }catch(e){const f=el('ferr');f.textContent=e.message;f.style.display='block';el('sub').disabled=false;}
}
async function truck(id){
  try{await rpc('raise_truck_alert',{p_token:G_TOKEN,p_announcement:id,p_message:null});
    toast(t('toast_alert'));await loadGrower();
  }catch(e){toast(e.message)}
}

/* ---------- ADMIN (Manon) ---------- */
let ADM=null, newDates={}, rForm=null, gForm=false, lForm=null, gOpen={};
async function loadAdmin(){

function renderAdmin(){
  const open=ADM.exceptions.filter(e=>!e.resolved_at);
  let h='';
  h+='<div class="card"><h2>'+t('alerts_h')+(open.length?' <span class="badge b-bad">'+open.length+' '+t('open')+'</span>':'')+'</h2>';
  if(!open.length)h+='<div class="muted">'+t('no_alerts')+'</div>';
  open.forEach(e=>{h+='<div class="row"><div><b>'+t('truck_btn')+'</b><div class="sub2">'+esc(e.grower)+' · '+esc(e.location)+' · '+e.pallets+' '+t('pallets')+' · '+t('pickup_pre')+' '+fmtD(e.pickup_date)+'</div>'
    +(e.message?'<div class="sub2">“'+esc(e.message)+'”</div>':'')+'</div>'
    +'<button class="btn tiny" onclick="resolveExc(\''+e.id+'\')">'+t('resolved_btn')+'</button></div>';});
  h+='</div>';

  const T=todayStr();
  const ann=ADM.announcements.filter(a=>a.status!=='cancelled'||a.change_flag==='cancelled');
  const upc=ann.filter(a=>a.pickup_date>=T), past=ann.filter(a=>a.pickup_date<T);
  const days=[...new Set([...upc.map(a=>a.pickup_date),...ADM.routes.filter(r=>r.date>=T).map(r=>r.date)])].sort();
  h+='<div class="card"><h2>'+t('planner_h')+'</h2>';
  if(!days.length)h+='<div class="muted">'+t('no_plan')+'</div>';
  days.forEach(d=>{
    h+='<div class="dayhead"><h3>'+fmtD(d)+(d===T?' · '+t('today'):'')+'</h3><button class="btn sub tiny" onclick="newRoute(\''+d+'\')">'+t('new_route')+'</button></div>';
    ADM.routes.filter(r=>r.date===d).forEach(r=>{
      if(rForm&&rForm.id===r.id){h+=routeFormHTML();return;}
      const on=upc.filter(a=>a.route_id===r.id);
      const tot=on.filter(a=>a.status!=='cancelled').reduce((s,a)=>s+a.pallets,0);
      const c=cap(r), pct=Math.min(100,Math.round(tot/c*100));
      const pm={};on.filter(a=>a.status!=='cancelled').forEach(a=>{const k=pname(a);pm[k]=(pm[k]||0)+a.pallets});
      const prodSum=Object.entries(pm).map(([p,n])=>n+' '+p).join(' · ');
      h+='<div class="route"><div class="rhead"><b>🚚 '+esc(r.name)+'</b><span class="muted">'+(r.carrier?esc(r.carrier)+' · ':'')+tot+' / '+c+' '+t('pallets')+'</span></div>'
        +'<div class="fill"><i class="'+(tot>c?'over':'')+'" style="width:'+pct+'%"></i></div>'
        +(prodSum?'<div class="sub2" style="margin-top:6px">'+esc(prodSum)+'</div>':'')
        +on.map(a=>annCard(a,d)).join('')
        +'<div class="acts"><button class="btn tiny sub" onclick="editRoute(\''+r.id+'\')">✏️</button>'
        +'<button class="btn tiny" style="background:#fff;color:var(--bad);border:1.5px solid var(--bad)" onclick="delRoute(\''+r.id+'\')">🗑</button></div></div>';
    });
    if(rForm&&!rForm.id&&rForm.date===d)h+=routeFormHTML();
    const un=upc.filter(a=>a.pickup_date===d&&!a.route_id);
    if(un.length)h+='<div class="pool"><b>'+t('pool')+' ('+un.length+')</b>'+un.map(a=>annCard(a,d)).join('')+'</div>';
  });
  if(past.length){
    h+='<details style="margin-top:12px"><summary>'+t('past_ann')+' ('+past.length+')</summary>';
    past.forEach(a=>{h+=annCard(a,null)});
    h+='</details>';
  }
  h+='</div>';

  h+='<div class="cols">';
  h+='<div class="card"><h2>'+t('settings_h')+'</h2>'
    +'<div class="grid2"><input id="capin" value="'+esc(ADM.settings.default_truck_capacity||'44')+'" inputmode="numeric">'
    +'<button class="btn tiny" onclick="setCap()">'+t('save')+'</button></div>'
    +'<div class="muted" style="margin-top:6px">'+t('cap_hint')+'</div></div>';

  h+='<div class="card"><h2>'+t('growers_h')+'</h2>';
  ADM.growers.forEach(g=>{
    h+='<details'+(gOpen[g.id]===false?'':' open')+' ontoggle="gOpen[\''+g.id+'\']=this.open"><summary>'+esc(g.name)+' <span class="muted">'+g.locations.length+' '+(g.locations.length===1?t('loc_one'):t('loc_many'))+'</span></summary>';
    h+='<div class="muted" style="margin:6px 0">'+esc(g.contact||'')+(g.phone?' · '+esc(g.phone):'')+'</div>';
    h+='<div class="linkbox">'+t('portal_link')+': '+location.origin+location.pathname+'?t='+g.token+'</div>'
      +'<button class="btn sub" onclick="copyLink(\''+g.token+'\')">'+t('copy_link')+'</button>';
    g.locations.forEach(l=>{
      h+='<h3>'+esc(l.name)+'</h3><div class="muted">'+esc(l.address||'')+'</div>';
      h+='<div class="subbox"><div class="sublbl">'+t('fixed_days')+'</div>'
        +'<div class="chips wdrow" style="margin-top:6px">'+[1,2,3,4,5,6,7].map(d=>'<button class="chip'+((l.weekly_days||[]).includes(d)?' sel':'')+'" id="wd-'+l.id+'-'+d+'" onclick="toggleWD(\''+l.id+'\','+d+')">'+wdN(d)+'</button>').join('')+'</div>'
        +'<div class="muted" style="margin-top:6px">'+t('fixed_hint')+'</div></div>';
      const ex=l.pickup_dates.filter(d=>d.active);
      h+='<div class="subbox"><div class="sublbl">'+t('extra_days')+'</div><div style="margin-top:6px">';
      if(ex.length)ex.forEach(d=>{h+='<span class="dt">'+fmtD(d.date)+'<button onclick="rmDate(\''+l.id+'\',\''+d.date+'\')">✕</button></span>';});
      else h+='<span class="muted">'+t('no_extra')+'</span>';
      h+='</div><div class="grid2" style="margin-top:8px"><input type="date" id="nd-'+l.id+'" min="'+todayStr()+'">'
        +'<button class="btn tiny" onclick="addDate(\''+l.id+'\')">'+t('add_day')+'</button></div>'
        +'<div class="muted" style="margin-top:6px">'+t('extra_hint')+'</div></div>';
      const up=expandDates({pickup_dates:ex.map(d=>d.date),weekly_days:l.weekly_days||[]}).filter(x=>x>=todayStr()).slice(0,4);
      if(up.length)h+='<div class="muted" style="margin:8px 0 2px">'+t('upcoming')+' '+up.map(fmtD).join(' · ')+'</div>';
    });
    if(lForm===g.id){
      h+='<div class="route" style="margin-top:10px"><div class="grid2">'
        +'<input type="text" id="lf-name" placeholder="'+t('f_lname')+'">'
        +'<input type="text" id="lf-addr" placeholder="'+t('f_addr')+'"></div>'
        +'<div class="acts"><button class="btn tiny" onclick="saveLoc(\''+g.id+'\')">'+t('save')+'</button>'
        +'<button class="btn tiny sub" onclick="lForm=null;renderAdmin()">'+t('cancel_btn')+'</button></div></div></details>';
    }else{
      h+='<div style="margin-top:10px"><button class="btn sub" onclick="addLoc(\''+g.id+'\')">'+t('add_loc')+'</button></div></details>';
    }
  });
  if(gForm){
    h+='<div class="route" style="margin-top:12px">'
      +'<div class="grid2"><input type="text" id="gf-name" placeholder="'+t('f_gname')+'">'
      +'<input type="text" id="gf-contact" placeholder="'+t('f_contact')+'"></div>'
      +'<div class="grid2" style="margin-top:8px"><input type="tel" id="gf-phone" placeholder="'+t('f_phone')+'">'
      +'<input type="text" id="gf-loc" placeholder="'+t('f_lname')+'" value="'+t('p_first_loc_def')+'"></div>'
      +'<div style="margin-top:8px"><input type="text" id="gf-addr" placeholder="'+t('f_addr')+'"></div>'
      +'<div class="acts"><button class="btn tiny" onclick="saveGrower()">'+t('save')+'</button>'
      +'<button class="btn tiny sub" onclick="gForm=false;renderAdmin()">'+t('cancel_btn')+'</button></div></div></div>';
  }else{
    h+='<div style="margin-top:12px"><button class="btn sub" onclick="addGrower()">'+t('new_grower')+'</button></div></div>';
  }
  h+='</div>';
  el('app').innerHTML=h;
}
function cap(r){return r.capacity||parseInt(ADM.settings.default_truck_capacity||'44',10)}
function annCard(a,d){
  const cancelled=a.status==='cancelled';
  const cls=cancelled?' cflag':(a.change_flag==='updated'?' flag':'');
  const st=a.status==='picked_up'?[t('st_picked'),'b-ok']:cancelled?[t('st_cancelled'),'b-bad']:[t('st_announced'),'b-warn'];
  let h='<div class="acard'+cls+'"><div class="row" style="border:0;padding:0"><div><b>'+esc(a.grower)+'</b>'
    +(a.open_alert?' <span class="badge b-bad">'+t('b_alert')+'</span>':'')
    +(a.change_flag==='updated'?' <span class="badge b-warn">'+t('b_changed')+'</span>':'')
    +(cancelled?' <span class="badge b-bad">'+t('b_cancelled_by')+'</span>':'')
    +'<div class="sub2">'+a.pallets+' '+t('pallets')+' '+esc(pname(a))+' · '+esc(a.location)+(a.note?' · “'+esc(a.note)+'”':'')+'</div></div>'
    +'<span class="badge '+st[1]+'">'+st[0]+'</span></div>';
  let acts='';
  if(a.status==='announced')acts+='<button class="btn tiny" onclick="setSt(\''+a.id+'\',\'picked_up\')">'+t('picked_btn')+'</button>';
  if(!cancelled&&d){
    if(a.route_id)acts+='<button class="btn tiny sub" onclick="assign(\''+a.id+'\',null)">'+t('unassign')+'</button>';
    else{
      const rs=ADM.routes.filter(r=>r.date===d);
      if(rs.length)acts+='<select id="rs-'+a.id+'">'+rs.map(r=>'<option value="'+r.id+'">'+esc(r.name)+'</option>').join('')+'</select>'
        +'<button class="btn tiny" onclick="assign(\''+a.id+'\',el(\'rs-'+a.id+'\').value)">'+t('to_route')+'</button>';
    }
  }
  if(a.change_flag)acts+='<button class="btn tiny sub" onclick="clearFlag(\''+a.id+'\')">'+t('ok_seen')+'</button>';
  if(acts)h+='<div class="acts">'+acts+'</div>';
  return h+'</div>';
}
async function assign(aid,rid){try{await rpc('admin_assign_route',{p_token:A_TOKEN,p_announcement:aid,p_route:rid});await loadAdmin();}catch(e){toast(e.message)}}
async function clearFlag(aid){try{await rpc('admin_clear_change_flag',{p_token:A_TOKEN,p_announcement:aid});await loadAdmin();}catch(e){toast(e.message)}}
function routeFormHTML(){

    +'<input type="text" id="rf-name" placeholder="'+t('f_route_name')+'" value="'+esc(r?r.name:'')+'">'

function dset(l){return (ADM.growers.flatMap(g=>g.locations).find(x=>x.id===l)?.pickup_dates||[]).filter(d=>d.active).map(d=>d.date)}
async function addDate(lid){

  try{await rpc('admin_set_pickup_dates',{p_token:A_TOKEN,p_location:lid,p_dates:ds});toast(t('toast_day_add'));await loadAdmin();}catch(e){toast(e.message)}
}
async function toggleWD(lid,d){
  const loc=ADM.growers.flatMap(g=>g.locations).find(x=>x.id===lid);
  const cur=(loc&&loc.weekly_days)||[];
  const ds=cur.includes(d)?cur.filter(x=>x!==d):[...cur,d];
  if(loc){loc.weekly_days=ds;renderAdmin();}
  try{await rpc('admin_set_weekly_days',{p_token:A_TOKEN,p_location:lid,p_days:ds});toast(t('toast_weekly'));}catch(e){toast(e.message);await loadAdmin();}
}
async function rmDate(lid,d){
  const ds=dset(lid).filter(x=>x!==d);
  try{await rpc('admin_set_pickup_dates',{p_token:A_TOKEN,p_location:lid,p_dates:ds});toast(t('toast_day_rm'));await loadAdmin();}catch(e){toast(e.message)}
}
async function resolveExc(id){try{await rpc('admin_resolve_exception',{p_token:A_TOKEN,p_exception:id});toast(t('toast_exc'));await loadAdmin();}catch(e){toast(e.message)}}
async function setSt(id,st){try{await rpc('admin_set_status',{p_token:A_TOKEN,p_announcement:id,p_status:st});await loadAdmin();}catch(e){toast(e.message)}}
function addGrower(){gForm=true;renderAdmin();const i=el('gf-name');if(i)i.focus()}
async function saveGrower(){
  const n=el('gf-name').value.trim();if(!n)return toast(t('name_req'));
  try{const r=await rpc('admin_upsert_grower',{p_token:A_TOKEN,p_id:null,p_name:n,p_contact:el('gf-contact').value.trim(),p_phone:el('gf-phone').value.trim()});
    const ln=el('gf-loc').value.trim()||t('p_first_loc_def');
    await rpc('admin_upsert_location',{p_token:A_TOKEN,p_id:null,p_grower:r.id,p_name:ln,p_address:el('gf-addr').value.trim()});
    gForm=false;toast(t('toast_grower'));await loadAdmin();
  }catch(e){toast(e.message)}
}
function addLoc(gid){lForm=gid;renderAdmin();const i=el('lf-name');if(i)i.focus()}
async function saveLoc(gid){
  const n=el('lf-name').value.trim();if(!n)return toast(t('name_req'));
  try{await rpc('admin_upsert_location',{p_token:A_TOKEN,p_id:null,p_grower:gid,p_name:n,p_address:el('lf-addr').value.trim()});
    lForm=null;toast(t('toast_loc'));await loadAdmin();
  }catch(e){toast(e.message)}
}
function copyLink(tok){
  const url=location.origin+location.pathname+'?t='+tok;
  (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>toast(t('toast_copy')),()=>prompt(t('p_copy'),url));
}

/* ---------- no-token: paste link ---------- */
function showLinkEntry(){
  el('app').innerHTML='<div class="center"><div style="font-size:40px">🫐</div>'
  +'<p style="margin-top:14px">'+t('link_msg')+'</p>'
  +'<input id="lnk" placeholder="'+t('link_ph')+'" autocomplete="off" style="margin-top:14px;width:100%;max-width:340px;padding:13px;border:1.5px solid var(--line);border-radius:12px;font-size:15px">'
  +'<div style="max-width:340px;margin:0 auto"><button class="btn" onclick="useLink()">'+t('open_btn')+'</button></div>'
  +'<p id="lerr" style="color:#b3261e;margin-top:10px"></p></div>';
}
async function useLink(){
  const v=el('lnk').value.trim(); if(!v)return;
  let t=null,a=null;
  try{const u=new URL(v); t=u.searchParams.get('t'); a=u.searchParams.get('admin');}catch(e){}
  if(!t&&!a&&/^([0-9a-f]{64}|[A-Za-z0-9]{8,12})$/.test(v)){
    try{await rpc('grower_context',{p_token:v}); t=v;}
    catch(e){ try{await rpc('admin_overview',{p_token:v}); a=v;}catch(e2){} }
  }
  if(a)location.href='?admin='+encodeURIComponent(a);
  else if(t)location.href='?t='+encodeURIComponent(t);
  else el('lerr').textContent=t('link_err');
}

/* ---------- boot ---------- */
el('langBtn').textContent=LANG==='nl'?'EN':'NL';
el('subT').textContent=t('portal_sub');
if(A_TOKEN)loadAdmin();
else if(G_TOKEN)loadGrower();
else showLinkEntry();
function idleRefresh(){
  if(document.hidden)return;
  const ae=document.activeElement;
  if(ae&&['TEXTAREA','INPUT','SELECT'].includes(ae.tagName))return;
  if(G_TOKEN){if(!sel.editing&&!sel.prod&&!sel.date)loadGrower()}
  else if(A_TOKEN){if(!rForm&&!gForm&&!lForm)loadAdmin()}
}
setInterval(idleRefresh,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)idleRefresh()});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
